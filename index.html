  let x0=1e9,x1=-1e9,y0=0,y1=f.h-1;
  for(const[x,y]of px){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
  const p=px.map(([x,y])=>[x-x0,y-y0]);let a=1e9,b=-1e9;
  for(const[,y]of p){a=Math.min(a,y);b=Math.max(b,y)}
  r={pix:p,w:x1-x0+1,h:y1-y0+1,it:a,ih:b-a+1,miss,f};
 }
 if(cache.size>500)cache.clear();
 cache.set(key,r);return r;
}

// ---- fontval: första fonten som ryms, fonter med saknade tecken sist
function one(c,lim){
 for(const st of[true,false])for(const r of c){if(st&&r.miss.length)continue;if(r.w<=lim&&r.ih<=H)return[r,true]}
 return[c.reduce((a,b)=>(b.w<a.w||(b.w===a.w&&b.ih<a.ih))?b:a),false];
}
function pair(dc,vc,zw,gap){
 for(const st of[true,false])for(const d of dc)for(const v of vc){
  if(st&&(d.miss.length||v.miss.length))continue;
  if(d.w<=zw&&v.w<=zw&&d.ih+gap+v.ih<=H)return[d,v,true];
 }
 const m=(c,k)=>c.reduce((a,b)=>(b[k]<a[k]||(b[k]===a[k]&&b.w<a.w))?b:a);
 return[m(dc,"ih"),m(vc,"ih"),false];
}

// ---- layout med CSV-reglerna (snap: via längst ner, destination längst upp)
function layout(t,force){
 const warns=[],pad=CFG.pl+CFG.pr,gap=CFG.gap;
 const act={line:!!t.line.trim(),dest:!!t.dest.trim(),via:!!t.via.trim()};
 const cands=k=>{
  if(!act[k])return[];
  const txt=t[k];let fs;
  if(force&&k!=="line")fs=[force];
  else{
   fs=allowed(k==="line"?CFG.lp:k==="dest"?(act.via?CFG.dpv:CFG.dp):CFG.vp);
   if(k==="line"){
    const s=F[CFG.sp.f];
    if(s){fs=fs.filter(f=>f!==s);const q=txt.trim();if(/\p{L}/u.test(q)&&q.length>CFG.sp.len)fs.unshift(s)}
   }
  }
  const r=fs.map(f=>rend(f,txt)).filter(r=>r.pix.length);
  if(!r.length)warns.push(NAMES[k]+": ingen font kan rita texten");
  return r;
 };
 let line=null,lw=0,d=null,v=null,ok;
 const lc=cands("line");
 if(lc.length){
  const lim=W-pad;[line,ok]=one(lc,lim);
  if(!ok)warns.push(`Linje: ingen font ryms (${line.w} px, gräns ${lim} px)`);
  lw=Math.min(W,line.w+pad);
 }
 const zx=line?lw:0,zw=Math.max(0,W-zx),dc=cands("dest"),vc=cands("via");
 if(dc.length&&vc.length){[d,v,ok]=pair(dc,vc,zw,gap);if(!ok)warns.push(`Destination + via ryms inte (zon ${zw} px, höjd ${H} px)`)}
 else if(dc.length){[d,ok]=one(dc,zw);if(!ok)warns.push(`Destination: ingen font ryms (${d.w} px, zon ${zw} px)`)}
 else if(vc.length){[v,ok]=one(vc,zw);if(!ok)warns.push(`Via: ingen font ryms (${v.w} px, zon ${zw} px)`)}
 const items={line,dest:d,via:v},top={};
 for(const k in items)if(items[k])top[k]=(H-items[k].ih)>>1;
 if(d&&v){const t0=Math.max(0,(H-(d.ih+gap+v.ih))>>1);top.dest=t0;top.via=t0+d.ih+gap}
 if(v){top.via=H-v.ih;if(d)top.dest=0}
 const col={line:t.cl,dest:t.cd,via:t.cv},px=new Map(),ext={},used=[];
 for(const k of["line","dest","via"]){
  const r=items[k];if(!r)continue;
  used.push(NAMES[k]+": "+r.f.n);
  if(r.miss.length)warns.push(`${NAMES[k]}: fonten saknar tecknen ${[...new Set(r.miss)].sort().join(" ")}`);
  let h;
  if(k==="line"&&lw-pad>=r.w)h=pad?CFG.pl+((lw-pad-r.w)>>1):(lw-r.w)>>1;
  else h=zx*(k==="line"?0:1)+(((k==="line"?lw:zw)-r.w)>>1);
  h=Math.max(0,Math.min(W-1,h));
  const y0=top[k]-r.it;let n=0,x1=0,ya=99,yb=-1;
  for(const[x,y]of r.pix){
   const X=h+x,Y=y0+y;if(X<0||X>=W||Y<0||Y>=H)continue;
   px.set(Y*W+X,col[k]);n++;ya=Math.min(ya,Y);yb=Math.max(yb,Y);
  }
  if(n<r.pix.length)warns.push(`${NAMES[k]}: texten (${r.w} px bred) går utanför skylten och beskärs`);
  else if(k!=="line"&&zw<W&&r.w>zw)warns.push(`${NAMES[k]} (${r.w} px) är bredare än sin zon (${zw} px)`);
  ext[k]=[h,h+r.w,ya,yb+1];
 }
 if(ext.line)for(const k of["dest","via"])if(ext[k]&&ext[k][0]<ext.line[1])warns.push(`Linjenumret och ${NAMES[k]} överlappar`);
 if(ext.dest&&ext.via&&ext.via[2]<ext.dest[3])warns.push("Via överlappar destinationen i höjdled");
 const bg=new Map();
 if(t.bgon&&lw>0)for(let y=0;y<H;y++)for(let x=0;x<lw;x++)if(!px.has(y*W+x))bg.set(y*W+x,t.bgc);
 return{px,bg,warns,used};
}

// ---- rita runda lampor (samma geometri som render_rows)
function mk(hex,L){
 const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)),o=new Uint8Array(L*L*3),R=L/2;
 for(let y=0;y<L;y++)for(let x=0;x<L;x++){
  let n=0;
  for(let sy=0;sy<4;sy++)for(let sx=0;sx<4;sx++){const a=x+(sx+.5)/4-R,b=y+(sy+.5)/4-R;if(a*a+b*b<=R*R)n++}
  for(let i=0;i<3;i++)o[(y*L+x)*3+i]=Math.floor(c[i]*n/16+.5);
 }
 return o;
}
function bitmap(res){
 const m=CFG.mag,L=CFG.lamp*m,gh=CFG.gh.map(g=>g*m),gv=CFG.gv.map(g=>g*m),xs=[0],ys=[0];
 for(let i=1;i<W;i++)xs.push(xs[i-1]+L+gh[(i-1)%gh.length]);
 for(let i=1;i<H;i++)ys.push(ys[i-1]+L+gv[(i-1)%gv.length]);
 const w=xs[W-1]+L,h=ys[H-1]+L,data=new Uint8ClampedArray(w*h*4),sp={},OFF=CFG.off?"#2a2a2a":"#000000";
 for(let i=3;i<data.length;i+=4)data[i]=255;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const k=y*W+x,hex=res.px.get(k)||res.bg.get(k)||OFF,s=sp[hex]||(sp[hex]=mk(hex,L));
  for(let r=0;r<L;r++){let o=((ys[y]+r)*w+xs[x])*4,q=r*L*3;for(let c=0;c<L;c++,o+=4,q+=3){data[o]=s[q];data[o+1]=s[q+1];data[o+2]=s[q+2]}}
 }
 return{w,h,data};
}

// ---- GIF (LZW)
function lzw(idx,mcs){
 const clear=1<<mcs,eoi=clear+1,out=[];let size=mcs+1,next=eoi+1,dict=new Map(),cur=0,nb=0;
 const emit=c=>{cur|=c<<nb;nb+=size;while(nb>=8){out.push(cur&255);cur>>>=8;nb-=8}};
 emit(clear);let pre=idx[0];
 for(let i=1;i<idx.length;i++){
  const k=idx[i],key=pre*256+k,v=dict.get(key);
  if(v!==undefined){pre=v;continue}
  emit(pre);
  if(next===4096){emit(clear);next=eoi+1;size=mcs+1;dict=new Map()}
  else{if(next>=(1<<size))size++;dict.set(key,next++)}
  pre=k;
 }
 emit(pre);emit(eoi);if(nb>0)out.push(cur&255);
 return out;
}
function gif(fr,cs){
 const{w,h}=fr[0],uniq=new Set();
 for(const f of fr)for(let i=0;i<f.data.length;i+=4)uniq.add(f.data[i]<<16|f.data[i+1]<<8|f.data[i+2]);
 let sh=0,pal;
 const q=c=>sh?((((c>>16)&255)>>sh<<sh)<<16|(((c>>8)&255)>>sh<<sh)<<8|((c&255)>>sh<<sh)):c;
 for(;;sh++){pal=[...new Set([...uniq].map(q))].sort((a,b)=>a-b);if(pal.length<=256)break}
 const ix=new Map(pal.map((c,i)=>[c,i])),bits=Math.max(1,32-Math.clz32(pal.length-1)),mcs=Math.max(2,bits),o=[];
 const u16=n=>o.push(n&255,(n>>8)&255);
 o.push(...[..."GIF89a"].map(c=>c.charCodeAt(0)));u16(w);u16(h);o.push(0x80|0x70|(bits-1),0,0);
 for(let i=0;i<(1<<bits);i++){const c=pal[i]||0;o.push((c>>16)&255,(c>>8)&255,c&255)}
 o.push(0x21,0xff,0x0b,...[..."NETSCAPE2.0"].map(c=>c.charCodeAt(0)),3,1,0,0,0);
 for(const f of fr){
  const id=new Uint8Array(w*h);
  for(let p=0,i=0;p<id.length;p++,i+=4)id[p]=ix.get(q(f.data[i]<<16|f.data[i+1]<<8|f.data[i+2]));
  o.push(0x21,0xf9,4,4);u16(Math.max(2,cs));o.push(0,0,0x2c);u16(0);u16(0);u16(w);u16(h);o.push(0,mcs);
  const d=lzw(id,mcs);
  for(let a=0;a<d.length;a+=255){const b=d.slice(a,a+255);o.push(b.length);for(const x of b)o.push(x)}
  o.push(0);
 }
 o.push(0x3b);return new Uint8Array(o);
}

// ---- gränssnitt
const cv=$("cv"),cx=cv.getContext("2d");let frames=[],isGif=false,tm=null,dl=null;
const show=f=>{cv.width=f.w;cv.height=f.h;cx.putImageData(new ImageData(f.data,f.w,f.h),0,0)};
const say=s=>{$("status").textContent=s};
function update(){
 const t={line:$("line").value,dest:$("dest").value,via:$("via").value,cl:$("c_line").value,cd:$("c_dest").value,cv:$("c_via").value,bgon:$("bgon").checked,bgc:$("c_bg").value};
 clearInterval(tm);
 if(!t.line.trim()&&!t.dest.trim()&&!t.via.trim()){frames=[];$("warn").textContent="";$("go").disabled=true;$("info").textContent="Skriv text nedan.";return}
 const vl=t.via.toLowerCase(),has=!!t.via.trim();
 isGif=has&&CFG.phr.some(p=>vl.includes(p));
 const noVia=has&&!isGif&&!/\bvia\b/i.test(t.via),force=noVia?(F[CFG.two]||null):null;
 const pages=isGif?[{...t,via:""},{...t,dest:t.via,via:""}]:[t];
 const warns=[],used=[];frames=[];
 pages.forEach((p,i)=>{
  const r=layout(p,force),pre=isGif?`sida ${i+1}: `:"";
  r.warns.forEach(w=>warns.push(pre+w));
  if(!r.px.size)warns.push(pre+"tom, inget att rita");
  if(i===0)used.push(...r.used);
  frames.push(bitmap(r));
 });
 show(frames[0]);
 if(frames.length>1){let i=0;tm=setInterval(()=>show(frames[i=(i+1)%frames.length]),CFG.sec*1000)}
 $("warn").textContent=warns.join("\n");
 $("go").disabled=warns.length>0;
 $("go").textContent=isGif?"Spara GIF":"Spara PNG";
 $("info").textContent=(isGif?"GIF, 2 sidor · ":"PNG · ")+used.join(" · ")+(noVia?" · fast font (via utan ordet via)":"");
}
const safe=n=>n.replace(/[<>:"\/\\|?*\x00-\x1f]/g,"_").replace(/^[ .]+|[ .]+$/g,"")||"skylt";
async function save(fn,blob){
 if(dl){
  try{await dl.save({filename:fn,data:blob});say("Sparade "+fn)}
  catch(e){say(e&&e.code==="declined"?"Avbröts":"Kunde inte spara: "+((e&&(e.message||e.code))||e))}
  return;
 }
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;
 document.body.appendChild(a);a.click();a.remove();say("Sparade "+fn);
}
$("go").onclick=()=>{
 const name=safe($("name").value.trim()||[$("line").value.trim(),$("dest").value.trim()].filter(Boolean).join("_"));
 if(isGif)save(name+".gif",new Blob([gif(frames,Math.round(CFG.sec*100))],{type:"image/gif"}));
 else{show(frames[0]);cv.toBlob(b=>save(name+".png",b),"image/png")}
};
document.querySelectorAll("input").forEach(e=>e.addEventListener("input",update));
try{window.claude&&claude.use&&claude.use("downloads").then(d=>{dl=d}).catch(()=>{})}catch(e){}
</script></body></html>
